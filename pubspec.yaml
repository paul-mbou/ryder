name: ryde_app
description: "Ryde App is a modern Flutter application for ride-sharing, offering seamless booking and real-time updates."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  appwrite: 23.0.0
  flutter:
    sdk: flutter
  flutter_form_builder: ^10.3.0+2
  flutter_gutter: ^2.2.0
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.3.1
  flutter_svg: ^2.2.4
  form_builder_validators: ^11.3.0
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
  vector_map_tiles: ^9.0.0-beta.8
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.13.1
  flutter_gen_runner: ^5.13.0

flutter_gen:
  output: lib/src/core/constants/assets/
  integrations:
    image: true
    flutter_svg: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
